<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Gestor de Tareas</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Pantalla de Login con Fondo de Video -->
  <div class="container" id="login-container">
    <!-- Video de fondo -->
    <video autoplay muted loop playsinline class="background-video">
      <source src="assets/video.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>

    <!-- Contenido sobre el video -->
    <div class="content-overlay">
      <h1 class="title">TASKFLOW</h1>
      <h2 class="subtitle">Iniciar Sesión</h2>
      <input type="email" id="email" placeholder="Correo electrónico" required />
      <input type="password" id="password" placeholder="Contraseña" required />
      <button onclick="login()" class="btn-primary">Iniciar Sesión</button>
      <p><a href="#" onclick="showRegister()">Regístrate</a></p>
    </div>
  </div>

  <!-- Pantalla de Registro -->
  <div class="container hidden" id="register-container">
    <h1 class="title">TASKFLOW</h1>
    <h2 class="subtitle">Crear Cuenta</h2>
    <input type="text" id="name" placeholder="Nombre completo" required />
    <input type="email" id="regEmail" placeholder="Correo electrónico" required />
    <input type="password" id="regPassword" placeholder="Contraseña" required />
    <button onclick="register()" class="btn-primary">Registrar</button>
    <p><a href="#" onclick="showLogin()">Volver al login</a></p>
  </div>

  <!-- Dashboard de Tareas -->
  <div class="dashboard hidden" id="tasks-container">
    <header class="header">
      <h1 class="title">Bienvenido, <span id="userName"></span>!</h1>
      <button onclick="logout()" class="btn-logout">Cerrar sesión</button>
    </header>

    <div class="task-form">
      <input type="text" id="taskTitle" placeholder="Título de la tarea" />
      <textarea id="taskDesc" placeholder="Descripción (opcional)"></textarea>
      <input type="date" id="taskDueDate" />
      <select id="taskPriority">
        <option value="baja">Baja</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
      </select>
      <select id="taskStatus">
        <option value="pendiente">Pendiente</option>
        <option value="en_proceso">En Proceso</option>
        <option value="completada">Completada</option>
      </select>
      <button onclick="createTask()" class="btn-primary">+ Añadir Tarea</button>
    </div>

    <div class="task-board">
      <div class="column">
        <h3>📋 Pendientes</h3>
        <ul id="pending-list"></ul>
      </div>
      <div class="column">
        <h3>🔄 En Proceso</h3>
        <ul id="in-progress-list"></ul>
      </div>
      <div class="column">
        <h3>✅ Completadas</h3>
        <ul id="completed-list"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
